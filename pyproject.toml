[project]
name = "quantalyze"
version = "0.1.10"
description = "Utility functions for analyzing scientific data."
license = "MIT"
license-files = ["LICENSE*"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numba>=0.60.0",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "scipy>=1.13.1",
]


[project.urls]
Homepage = "https://github.com/jakeayres/Quantalyze"
Documentation = "https://quantalyze.readthedocs.io/en/latest/"
Repository = "https://github.com/jakeayres/Quantalyze.git"
Issues = "https://github.com/jakeayres/Quantalyze/issues"


[dependency-groups]
test = [
    "pytest>=8.3.5",
]
docs = [
    "zensical>=0.0.65; python_version >= '3.10'",
    "mkdocstrings-python>=2.0.9; python_version >= '3.10'",
]


[tool.uv]
# `uv run` / `uv sync` install the test tools by default (docs stay opt-in).
default-groups = ["test"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
]
